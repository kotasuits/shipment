<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Instant OCR</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
    .container { max-width: 900px; margin:auto; background:#1f1f1f; padding:25px; border-radius:12px; }
    #dropZone { border: 3px dashed #4CAF50; padding:60px 20px; border-radius:12px; cursor:pointer; margin:20px 0; }
    #preview { max-width:100%; max-height:500px; border-radius:10px; margin:15px 0; }
    button { padding:14px 28px; font-size:17px; border:none; border-radius:8px; cursor:pointer; margin:10px; }
    #ocrBtn { background:#4CAF50; color:white; }
    textarea { width:100%; height:320px; background:#000; color:#0f0; padding:15px; font-size:16px; border-radius:8px; }
    input { padding:10px; width:80%; margin:10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Instant Photo OCR</h1>

    <input type="text" id="apiKey" placeholder="Enter your free OCR.space API Key" style="display:block;">
    <small>Get free key from: <a href="https://ocr.space/ocrapi" target="_blank" style="color:#4CAF50">https://ocr.space/ocrapi</a></small>

    <div id="dropZone">Drop image here or click to upload</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <img id="preview" alt="Preview">

    <button id="ocrBtn" disabled>🚀 Extract Text Instantly</button>

    <div id="status"></div>
    <textarea id="result"></textarea>
    <button id="copyBtn" style="display:none;">📋 Copy Text</button>
  </div>

  <script>
    let currentBase64 = null;
    const apiKeyInput = document.getElementById('apiKey');

    // Auto-fill if you have saved key
    if (localStorage.getItem('ocrKey')) apiKeyInput.value = localStorage.getItem('ocrKey');

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const ocrBtn = document.getElementById('ocrBtn');
    const resultArea = document.getElementById('result');
    const status = document.getElementById('status');
    const copyBtn = document.getElementById('copyBtn');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

    // Drag & Drop
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#fff'; });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.style.borderColor = '#4CAF50';
      handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        preview.src = ev.target.result;
        currentBase64 = ev.target.result.split(',')[1];
        ocrBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    ocrBtn.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        status.textContent = "❌ Please enter your OCR.space API Key";
        return;
      }
      localStorage.setItem('ocrKey', key);

      status.textContent = "Processing...";
      ocrBtn.disabled = true;

      try {
        const form = new FormData();
        form.append('base64Image', currentBase64);
        form.append('language', 'eng');
        form.append('OCREngine', '2');
        form.append('isOverlayRequired', 'false');
        form.append('scale', 'true');

        const res = await fetch('https://api.ocr.space/parse/image', {
          method: 'POST',
          headers: { 'apikey': key },
          body: form
        });

        const data = await res.json();

        if (data.IsErroredOnProcessing) {
          resultArea.value = "Error: " + (data.ErrorMessage || data.ErrorDetails);
        } else {
          resultArea.value = data.ParsedResults[0].ParsedText || "No text found.";
        }
        copyBtn.style.display = 'inline-block';
        status.textContent = "✅ Done!";
      } catch (err) {
        status.textContent = "❌ Failed. Check API key or internet.";
      } finally {
        ocrBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', () => {
      resultArea.select();
      document.execCommand('copy');
      copyBtn.textContent = '✅ Copied!';
      setTimeout(() => copyBtn.textContent = '📋 Copy Text', 2000);
    });
  </script>
</body>
</html>
