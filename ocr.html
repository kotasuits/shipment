<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Photo OCR</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#111; color:#eee; text-align:center; }
    .container { max-width: 900px; margin: auto; background:#1f1f1f; padding:25px; border-radius:12px; }
    #dropZone { border: 3px dashed #4CAF50; padding:50px; border-radius:10px; cursor:pointer; margin:20px 0; }
    #preview { max-width:100%; max-height:500px; border-radius:8px; margin:15px 0; }
    button { padding:14px 30px; margin:10px; font-size:17px; border:none; border-radius:8px; cursor:pointer; }
    #ocrBtn { background:#4CAF50; color:white; }
    textarea { width:100%; height:300px; background:#000; color:#0f0; padding:15px; font-family:monospace; border-radius:8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Instant Photo OCR</h1>
    <p>Drop image or click to upload → Text appears almost instantly</p>

    <div id="dropZone">Drop image here or click to upload<br><small>Fast & Free (OCR.space)</small></div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <img id="preview" alt="Preview">

    <button id="ocrBtn" disabled>🔥 Extract Text Instantly</button>

    <div id="status"></div>
    <textarea id="result" placeholder="Extracted text will appear here..."></textarea>

    <button id="copyBtn" style="display:none;">📋 Copy Text</button>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const ocrBtn = document.getElementById('ocrBtn');
    const resultText = document.getElementById('result');
    const status = document.getElementById('status');
    const copyBtn = document.getElementById('copyBtn');

    let currentImageBase64 = null;

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#fff'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#4CAF50');
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.style.borderColor = '#4CAF50';
      handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        preview.src = ev.target.result;
        currentImageBase64 = ev.target.result.split(',')[1]; // base64 only
        ocrBtn.disabled = false;
        resultText.value = '';
      };
      reader.readAsDataURL(file);
    }

    ocrBtn.addEventListener('click', async () => {
      if (!currentImageBase64) return;

      status.textContent = "Processing...";
      ocrBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('base64Image', currentImageBase64);
        formData.append('language', 'eng');           // Change to 'eng+hin' etc.
        formData.append('isOverlayRequired', 'false');
        formData.append('OCREngine', '2');            // Engine 2 is faster & better

        const response = await fetch('https://api.ocr.space/parse/image', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        
        if (data.IsErroredOnProcessing) {
          resultText.value = "Error: " + data.ErrorMessage;
        } else {
          resultText.value = data.ParsedResults[0].ParsedText || "No text found.";
        }
        copyBtn.style.display = 'inline-block';
        status.textContent = "✅ Done!";
      } catch (err) {
        status.textContent = "❌ Error - Check internet";
        console.error(err);
      } finally {
        ocrBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', () => {
      resultText.select();
      document.execCommand('copy');
      copyBtn.textContent = '✅ Copied!';
      setTimeout(() => copyBtn.textContent = '📋 Copy Text', 2000);
    });
  </script>
</body>
</html>
