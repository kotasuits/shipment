<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Instant Photo OCR</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
    .container { max-width: 900px; margin:auto; background:#1f1f1f; padding:25px; border-radius:12px; }
    #dropZone { border: 3px dashed #4CAF50; padding:60px 20px; border-radius:12px; cursor:pointer; margin:20px 0; }
    #preview { max-width:100%; max-height:500px; border-radius:10px; margin:15px 0; }
    button { padding:14px 28px; font-size:17px; border:none; border-radius:8px; cursor:pointer; margin:10px; }
    #ocrBtn { background:#4CAF50; color:white; }
    textarea { width:100%; height:320px; background:#000; color:#0f0; padding:15px; font-size:16px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Instant Photo OCR</h1>
    <p>Your API Key is set</p>

    <div id="dropZone">📸 Drop image here or click to upload</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <img id="preview" alt="Preview">

    <button id="ocrBtn" disabled>🚀 Extract Text Instantly</button>

    <div id="status"></div>
    <textarea id="result" placeholder="Extracted text will appear here..."></textarea>
    <button id="copyBtn" style="display:none;">📋 Copy Text</button>
  </div>

  <script>
    const API_KEY = "K89407475788957";   // Your key is already set

    let currentBase64 = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const ocrBtn = document.getElementById('ocrBtn');
    const resultArea = document.getElementById('result');
    const status = document.getElementById('status');
    const copyBtn = document.getElementById('copyBtn');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

    // Drag & Drop Support
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#fff'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#4CAF50');
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.style.borderColor = '#4CAF50';
      handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        preview.src = ev.target.result;
        currentBase64 = ev.target.result.split(',')[1];
        ocrBtn.disabled = false;
        status.textContent = "";
      };
      reader.readAsDataURL(file);
    }

    ocrBtn.addEventListener('click', async () => {
      if (!currentBase64) return;

      status.textContent = "Processing image...";
      ocrBtn.disabled = true;

      try {
        const form = new FormData();
        form.append('base64Image', currentBase64);
        form.append('language', 'eng');           // Change to eng+hin if needed
        form.append('OCREngine', '2');
        form.append('isOverlayRequired', 'false');
        form.append('scale', 'true');

        const res = await fetch('https://api.ocr.space/parse/image', {
          method: 'POST',
          headers: { 'apikey': API_KEY },
          body: form
        });

        const data = await res.json();

        if (data.IsErroredOnProcessing) {
          resultArea.value = "❌ Error: " + (data.ErrorMessage || "Unknown error");
        } else {
          resultArea.value = data.ParsedResults[0].ParsedText.trim() || "No text found.";
        }
        copyBtn.style.display = 'inline-block';
        status.textContent = "✅ Extraction Complete!";
      } catch (err) {
        status.textContent = "❌ Request failed. Check internet connection.";
      } finally {
        ocrBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', () => {
      resultArea.select();
      document.execCommand('copy');
      copyBtn.textContent = '✅ Copied!';
      setTimeout(() => copyBtn.textContent = '📋 Copy Text', 2000);
    });
  </script>
</body>
</html>
