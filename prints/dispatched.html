<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatched Log</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.15), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media(max-width: 600px) {
            .header { flex-direction: column; gap: 15px; }
        }

        .header-title h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button.refresh-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button.refresh-btn:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 1000px;
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.05); }

        .td-status {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .tracking-photo {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 2000;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 90%; max-width: 500px;
            padding: 30px;
            position: relative;
        }
        .close-modal {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>Dispatched Items</h1>
            <p>Live data synced from Google Sheets</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
            <button class="refresh-btn" onclick="fetchData()">↻ Refresh</button>
            <button class="refresh-btn" onclick="setupGitHubConfig()">⚙️ GitHub Setup</button>
            <button class="refresh-btn" style="background:rgba(239,68,68,0.15);color:#f87171;border-color:rgba(239,68,68,0.4);" onclick="clearAllCache()">🗑 Clear Cache</button>
        </div>
    </div>

    <div class="nav-links">
        <a href="qr.html">📄 Labels</a>
        <a href="scanner.html">🔍 Scanner</a>
        <a href="../uploads.html">📸 Upload Tracking</a>
        <a href="../search.html">🔎 Search Photos</a>
    </div>

    <div class="glass-card">
        <div id="setup-warning" class="setup-warning" style="display:none;">
            <strong>Setup Required:</strong> Add your Google Web App URL.
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Search by name or phone..." onkeyup="filterTable()">
        </div>

        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <p>Fetching data...</p>
        </div>

        <div id="error" class="error-state" style="display:none;"></div>
        <div id="empty" class="empty-state" style="display:none;">No dispatched items found.</div>

        <table id="data-table" style="display:none;">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Status</th>
                    <th>Address</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        // ================== CONFIG ==================
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwq6qCSjSJbk3YsTDD8pjfmROmA6ab8_GqDx1sPZIWQaOpM3dN5Vr1dwcWykOE_LklUAA/exec";

        window._rowStore = [];

        // GitHub Config Setup
        function setupGitHubConfig() {
            const token = prompt("Enter your GitHub Personal Access Token (with repo scope):");
            if (!token) return;
            
            const repo = prompt("Enter your repo (username/repo):", "YOURUSERNAME/your-repo");
            if (!repo) return;

            const cfg = { token, repo, branch: "main" };
            localStorage.setItem('ghTrackCfg', JSON.stringify(cfg));
            alert("✅ GitHub config saved! Refresh the page.");
        }

        function clearAllCache() {
            if (confirm("Clear all cache?")) {
                localStorage.removeItem('dispatchedCache');
                localStorage.removeItem('trackingData');
                localStorage.removeItem('deletedOrders');
                fetchData();
            }
        }

        window.onload = function () {
            if (!GOOGLE_WEB_APP_URL) {
                document.getElementById('setup-warning').style.display = 'block';
                return;
            }
            fetchData();
        };

        function renderData(data) {
            if (!data || data.length === 0) {
                document.getElementById('empty').style.display = 'block';
                document.getElementById('data-table').style.display = 'none';
                return;
            }

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            window._rowStore = [];

            const deletedOrders = JSON.parse(localStorage.getItem('deletedOrders') || '[]');

            [...data].reverse().forEach((row, idx) => {
                if (!row.timestamp) return;
                if (deletedOrders.includes(row.timestamp)) return;

                const address = row.address || row.Address || row.name || 'N/A';
                const phone = row.phone || row.Phone || '';
                const awb = row.awb || row.AWB || '';

                let displayDate = row.timestamp;
                if (row.timestamp) {
                    const d = new Date(row.timestamp);
                    if (!isNaN(d)) {
                        displayDate = d.toLocaleString('en-IN');
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="td-time">${displayDate}</td>
                    <td><span class="td-status">Dispatched</span></td>
                    <td>${address}</td>
                    <td>
                        <button class="track-btn" onclick="openTracker(${idx})">📍 Track</button>
                    </td>
                `;
                tbody.appendChild(tr);
                window._rowStore.push({ phone, timestamp: row.timestamp, awb });
            });

            document.getElementById('data-table').style.display = 'table';
        }

        async function fetchData() {
            const cached = localStorage.getItem('dispatchedCache');
            if (cached) renderData(JSON.parse(cached));

            document.getElementById('loading').style.display = cached ? 'none' : 'block';
            document.getElementById('error').style.display = 'none';

            try {
                const res = await fetch(GOOGLE_WEB_APP_URL + '?t=' + Date.now());
                const text = await res.text();
                const data = JSON.parse(text);

                localStorage.setItem('dispatchedCache', JSON.stringify(data));
                renderData(data);
            } catch (err) {
                console.error(err);
                document.getElementById('error').innerHTML = `<p>Failed to fetch data. Check internet / Google Script.</p>`;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function filterTable() {
            const filter = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.querySelectorAll("#table-body tr");
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
            });
        }

        function openTracker(idx) {
            const row = window._rowStore[idx];
            if (!row) return;

            let modal = document.getElementById('trackingModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'trackingModal';
                modal.className = 'modal-overlay';
                document.body.appendChild(modal);
            }

            modal.innerHTML = `
                <div class="modal-content">
                    <button class="close-modal" onclick="closeTracker()">×</button>
                    <div id="modal-photo" class="tracking-photo">
                        <div class="spinner" style="width:40px;height:40px;"></div>
                    </div>
                    <h3>Parcel Tracking</h3>
                    <p style="color:var(--text-muted)">📞 ${row.phone || 'N/A'}</p>
                    <div id="tracking-timeline"></div>
                    <div id="live-track-btn-wrap" style="margin-top:15px;"></div>
                    <button class="refresh-btn" style="width:100%;margin-top:15px;" onclick="loadTrackingData('${row.phone}','${row.awb || ''}')">↻ Refresh Photo</button>
                </div>
            `;

            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);

            loadTrackingData(row.phone, row.awb);
        }

        function closeTracker() {
            const modal = document.getElementById('trackingModal');
            if (modal) modal.classList.remove('show');
        }

        // ================== MAIN FIX ==================
        async function loadTrackingData(phone, awb = '') {
            const photoContainer = document.getElementById('modal-photo');
            const cfg = JSON.parse(localStorage.getItem('ghTrackCfg') || '{}');

            if (!cfg.repo) {
                photoContainer.innerHTML = `<div style="text-align:center;padding:30px;">GitHub config not set.<br><button onclick="setupGitHubConfig()">Setup Now</button></div>`;
                return;
            }

            const cleanPhone = (phone || '').replace(/\D/g, '');
            const last5 = cleanPhone.slice(-5);

            let photoUrl = null;
            let foundAwb = awb;

            try {
                // 1. Try records.json
                const recordsRes = await fetch(`https://raw.githubusercontent.com/${cfg.repo}/${cfg.branch || 'main'}/records.json?t=${Date.now()}`);
                if (recordsRes.ok) {
                    const records = await recordsRes.json();
                    const match = records.find(r => (r.phone || '').replace(/\D/g, '').slice(-5) === last5);
                    if (match) {
                        photoUrl = match.photoUrl || match.photo;
                        foundAwb = match.awb || foundAwb;
                    }
                }

                // 2. Fallback: Try direct image
                if (!photoUrl) {
                    const extensions = ['jpg', 'jpeg', 'png'];
                    for (let ext of extensions) {
                        const testUrl = `https://raw.githubusercontent.com/${cfg.repo}/${cfg.branch || 'main'}/images/${last5}.${ext}`;
                        const test = await fetch(testUrl, { method: 'HEAD' });
                        if (test.ok) {
                            photoUrl = testUrl;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }

            // Render Photo
            if (photoUrl) {
                photoContainer.innerHTML = `
                    <img src="${photoUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;" 
                         onclick="window.open('${photoUrl}','_blank')">
                `;
            } else {
                photoContainer.innerHTML = `
                    <div style="text-align:center;padding:40px 20px;">
                        <h2>📭</h2>
                        <strong>No photo uploaded yet</strong><br>
                        <a href="../uploads.html" target="_blank" style="color:#60a5fa;">Upload Tracking Photo →</a>
                    </div>
                `;
            }
        }

        // Add spinner animation
        const style = document.createElement('style');
        style.textContent = `@keyframes spin { to { transform: rotate(360deg); } }
            .spinner { border: 4px solid rgba(255,255,255,0.1); border-top-color:#60a5fa; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin: auto; }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
