<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Photo Upload</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- QR Code & Barcode Decoders -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --pl: #818cf8;
            --bg: #0a0f1e;
            --card: rgba(20, 30, 55, .78);
            --inp: rgba(10, 15, 35, .7);
            --txt: #f1f5f9;
            --muted: #94a3b8;
            --bdr: rgba(255, 255, 255, .09);
            --ok: #10b981;
            --warn: #f59e0b;
            --err: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 0%, rgba(99, 102, 241, .18), transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(34, 211, 238, .12), transparent 50%);
            color: var(--txt);
            min-height: 100vh;
            padding: 28px 16px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 26px;
            width: 100%;
            max-width: 940px;
        }

        nav a {
            color: var(--pl);
            text-decoration: none;
            font-weight: 600;
            padding: 7px 16px;
            border: 1.5px solid rgba(99, 102, 241, .4);
            border-radius: 8px;
            background: rgba(99, 102, 241, .08);
            transition: all .2s;
            font-size: .88rem;
        }

        nav a:hover,
        nav a.on {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        @media(max-width: 600px) {
            nav {
                gap: 8px;
                padding: 0 5px;
            }

            nav a {
                padding: 6px 12px;
                font-size: 0.8rem;
                flex: 1 1 calc(50% - 10px);
                text-align: center;
            }
        }

        .ph {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
            max-width: 940px;
        }

        .ph h1 {
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .ph p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--bdr);
            border-radius: 20px;
            padding: 26px;
            width: 100%;
            max-width: 940px;
            box-shadow: 0 28px 56px rgba(0, 0, 0, .35);
            margin-bottom: 22px;
        }

        .stitle {
            font-size: 1rem;
            font-weight: 600;
            color: var(--pl);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* GitHub Config */
        .cfg-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media(max-width:600px) {
            .cfg-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }

            .dz {
                padding: 30px 15px;
            }

            .dz-icon {
                font-size: 2.2rem;
            }
        }

        .fld label {
            display: block;
            font-size: .72rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 5px;
        }

        .fld input {
            width: 100%;
            background: var(--inp);
            border: 1px solid var(--bdr);
            border-radius: 9px;
            padding: 10px 13px;
            color: var(--txt);
            font-size: .9rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .fld input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .2);
        }

        .cfg-status {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: .85rem;
            font-weight: 600;
            display: none;
        }

        .cfg-status.ok {
            background: rgba(16, 185, 129, .15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, .3);
            display: block;
        }

        .cfg-status.bad {
            background: rgba(239, 68, 68, .12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, .3);
            display: block;
        }

        /* Drop zone */
        .dz {
            border: 2px dashed rgba(99, 102, 241, .45);
            border-radius: 14px;
            padding: 46px 20px;
            text-align: center;
            cursor: pointer;
            transition: all .3s;
            background: rgba(99, 102, 241, .04);
            position: relative;
        }

        .dz:hover,
        .dz.over {
            border-color: var(--pl);
            background: rgba(99, 102, 241, .11);
        }

        .dz input[type=file] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .dz-icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }

        .dz h3 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .dz p {
            color: var(--muted);
            font-size: .88rem;
        }

        .dz-badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.78rem;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Preview grid */
        #pgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .pc {
            background: rgba(10, 15, 35, .82);
            border: 1px solid var(--bdr);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            transition: transform .2s, box-shadow .2s;
            display: flex;
            flex-direction: column;
        }

        .pc:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
        }

        .pc img {
            width: 100%;
            height: 320px;
            object-fit: contain;
            background: #050811;
            display: block;
            cursor: pointer;
        }

        .pc .qr-status {
            position: absolute;
            top: 9px;
            left: 9px;
            background: rgba(15, 23, 42, 0.88);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 14px;
            font-weight: 600;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
            max-width: calc(100% - 60px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pc .qr-status.ok {
            background: rgba(16, 185, 129, 0.9);
            color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
        }

            background: rgba(59, 130, 246, 0.9);
            color: #ffffff;
            border-color:
